services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/litdb.sqlite3
    volumes:
      - litdb-data:/data

  ingest:
    build: .
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/litdb.sqlite3
    volumes:
      - litdb-data:/data
    profiles: ["ingest"]
    command: ["python", "-m", "spatial_omics_litdb.cli", "ingest", "--preprint-days", "3"]

volumes:
  litdb-data:
