[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-omics-litdb"
version = "0.1.0"
description = "Live spatial transcriptomics and spatial proteomics literature dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mirzazadeh Lab" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
  "lxml>=5.3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
qa = ["paper-qa>=5.4.0"]
postgres = ["psycopg[binary]>=3.2.0"]
dev = ["pytest>=8.3.0", "httpx>=0.27.2"]

[project.scripts]
spatial-omics-litdb = "spatial_omics_litdb.cli:main"

[tool.setuptools.packages.find]
include = ["spatial_omics_litdb*"]

[tool.setuptools.package-data]
spatial_omics_litdb = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
